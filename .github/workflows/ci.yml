name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (includes accessibility and contrast guards)
        run: npm test

      - name: Build package
        run: npm run build

      - name: Check package (artifact, publint, attw)
        run: npm run check:package

      - name: Build docs
        run: npm run docs:build

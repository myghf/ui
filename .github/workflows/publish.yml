name: Publish

# Merge-driven releases: a push to main either opens/updates the "Version Packages"
# pull request (when changesets are present) or publishes the versioned packages.
on:
  push:
    branches:
      - main

# Reset default permissions; each job declares exactly what it needs.
permissions: {}

# Avoid concurrent runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Decide whether this run should version (changesets found), publish
  # (no changesets, publishable versions), or do nothing.
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  # Bump versions, write CHANGELOG, and open/update the "Version Packages" PR.
  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit version changes
      pull-requests: write # open/update the version PR
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Version packages
        uses: changesets/action/version@v2
        with:
          # Uses GITHUB_TOKEN by default. If the org blocks Actions from creating
          # pull requests (the setting is greyed out), set a RELEASE_TOKEN secret
          # with a token that can create PRs and it will be used instead.
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # Build and pack the publishable tarballs in an unprivileged job.
  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build packages
        run: npm run build

      - name: Pack packages
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  # Publish the packed tarballs with npm Trusted Publishing (OIDC).
  # This is the only job granted id-token: write.
  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write # create git tags and GitHub releases
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Publish packages
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true
